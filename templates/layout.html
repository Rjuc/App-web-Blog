<!DOCTYPE html>

<html lang="es">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-rbsA2VBKQhggwzxH7pPCaAqO46MgnOM80zW1RWuH61DGLwZJEdK2Kadq2F9CUG65" crossorigin="anonymous">
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-kenU1KFdBIe4zVF0s0G1M5b4hcpxyD9F7jL+jjXkk+Q2h455rYXK/7HAuoJl+0I4" crossorigin="anonymous"></script>
        <link href="{{ url_for('static', filename='styles.css') }}" rel="stylesheet">
        <title>Mi blog: {% block title %}{% endblock %}</title>
    </head>
    <body>
        <h1 class="text-center" id="title">Mi blog de presentación personal</h1>
        <main>
            <nav class="menu">
                <ul>
                    <li><a href="{{ url_for('index') }}" class="link-info">Inicio</a></li>
                    {% for x in entradas %}
                    <li><a href="{{ url_for('entrada', id=x['id']) }}" class="link-info">{{ x["titulo"] }}</a></li>
                    {% endfor %}
                </ul>
            </nav>
            <div class="cuerpo">
                {% block main %}{% endblock %}
            </div>
        </main>
        <script src="{{ url_for('static', filename='script.js') }}"></script>
    </body>
</html>
